# HAProxy — WEBGIS scale (sticky OFF, roundrobin)
# Di depan (prod): Caddy (host network, TLS) → 127.0.0.1:8080 → frontend http_front :80
# Di depan (TPA): klien LAN → 0.0.0.0:8080 → frontend http_front :80
# mTLS: HAPROXY_MTLS_BIND:8443 → frontend mtls_front (mode tcp, passthrough) → backend_fastapi:8443
#
# Env (diisi compose dari /etc/webgis/scale.env; default = nilai prod):
#   HAPROXY_API_HOST  — Host yang seluruh path-nya ke API (default api-webgis-prod.perdanasolusiteknologi.com)
#   HAPROXY_FE_HOST   — Host frontend publik untuk X-Forwarded-Proto https (default webgis-prod.perdanasolusiteknologi.com)
# Validasi: docker run --rm -e HAPROXY_API_HOST=... -e HAPROXY_FE_HOST=... \
#   -v $PWD/infra/haproxy:/usr/local/etc/haproxy:ro haproxy:2.9.15-alpine \
#   haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    timeout http-request 15s
    timeout check 5s
    timeout tunnel 3600s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold valid    10s
    hold obsolete 10s

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if FALSE
    monitor-uri /healthz

frontend http_front
    bind *:80
    # Tambah XFF hanya bila belum ada (Caddy sudah mengisi IP klien asli).
    option  forwardfor if-none
    # Edge tepercaya: Caddy di host (via docker-proxy/NAT tampil sebagai gateway bridge 172.16/12) atau loopback.
    acl from_edge src 127.0.0.1 172.16.0.0/12
    # Dari luar edge: buang header klien palsu, set proto http.
    http-request del-header X-Forwarded-For unless from_edge
    http-request del-header X-Real-IP unless from_edge
    http-request set-header X-Forwarded-Proto http unless from_edge
    # Caddy (TLS) → HAProxy HTTP: untuk Host publik, bila edge tidak mengirim proto,
    # set https agar redirect FastAPI (slash) tidak Location http:// (mixed content).
    # Jangan paksa https untuk Host internal (mis. haproxy) — SSR FE memakai itu.
    acl missing_fwd_proto req.hdr_cnt(X-Forwarded-Proto) eq 0
    acl is_public_host hdr(host),field(1,:) -i "${HAPROXY_API_HOST}" "${HAPROXY_FE_HOST}"
    http-request set-header X-Forwarded-Proto https if from_edge missing_fwd_proto is_public_host
    # Domain API → SEMUA path ke API (/docs, /openapi.json, /health, /api/...).
    acl is_api_host hdr(host),field(1,:) -i "${HAPROXY_API_HOST}"
    acl is_health path /health
    acl is_api    path_beg /api
    acl is_swagger path_beg /docs /openapi.json
    use_backend api_backends if is_swagger
    use_backend api_backends if is_api_host or is_health or is_api
    default_backend fe_backends

backend api_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template api 10 backend_fastapi:8000 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none inter 5s fall 3 rise 2

backend fe_backends
    balance roundrobin
    option httpchk GET /favicon.ico
    http-check expect status 200-399
    server-template fe 10 gis-dashboard:3000 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none inter 5s fall 3 rise 2

# ---- mTLS passthrough (TCP) ----
# HAProxy tidak membuka TLS: sertifikat klien diverifikasi backend (MTLS_ALLOWED_CNS). IP klien di log backend =
# IP HAProxy (uvicorn tanpa PROXY protocol); IP klien asli tercatat di log HAProxy (option tcplog).
frontend mtls_front
    bind *:8443
    mode tcp
    option tcplog
    timeout client 300s
    default_backend mtls_backends

backend mtls_backends
    mode tcp
    balance roundrobin
    option tcp-check
    # Server DOWN bila listener mTLS belum naik (sertifikat belum dipasang) → koneksi ditolak, HTTP tidak terpengaruh.
    server-template mtls 10 backend_fastapi:8443 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none inter 10s fall 3 rise 2
