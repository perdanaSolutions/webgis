# HAProxy — LB utama WEBGIS
# Sticky: OFF (tanpa stick-table / cookie affinity) — JWT + Redis jti (ADR-001)
# Balance: roundrobin | Health API: GET /health expect 200
# Discovery replica Docker: server-template + resolver 127.0.0.11
#
# Bind TLS: [PERLU KONFIRMASI] — uncomment crt di frontend bila sertifikat siap.

global
    log stdout format raw local0
    maxconn 4096
    # stats socket opsional di container: /var/run/haproxy.sock

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    timeout http-request 15s
    timeout check 5s
    # Upload GeoJSON besar
    timeout tunnel 3600s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold valid    10s
    hold obsolete 10s

# --- Stats ops (bind localhost di host via publish 127.0.0.1:8404) ---
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if FALSE

frontend http_front
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/webgis.pem  # [PERLU KONFIRMASI] wajib sebelum go-live publik
    # http-request redirect scheme https unless { ssl_fc }  # aktifkan bersama bind :443

    # Anti-spoof: buang XFF/X-Real-IP dari klien; option forwardfor (defaults) menulis ulang dari peer TCP
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request set-header X-Forwarded-Proto http
    # http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # JANGAN: stick-table, cookie SERVERID, balance source untuk auth
    acl is_health path /health
    acl is_api    path_beg /api
    use_backend api_backends if is_health or is_api
    default_backend fe_backends

backend api_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Nama service Compose: backend_fastapi — max 10 slot (sesuaikan --scale)
    # init-addr last,libc,none: tetap start meski replica belum siap
    server-template api 10 backend_fastapi:8000 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none inter 5s fall 3 rise 2

backend fe_backends
    balance roundrobin
    option httpchk GET /
    http-check expect status 200-399
    # TCP-only alternatif bila FE belum punya path health: ganti option httpchk → option tcp-check
    server-template fe 10 gis-dashboard:3000 check resolvers docker resolve-prefer ipv4 init-addr last,libc,none inter 5s fall 3 rise 2
