apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-fastapi
  namespace: webgis
spec:
  replicas: 2  # diganti HPA; min [PERLU KONFIRMASI]
  selector:
    matchLabels:
      app: backend-fastapi
  template:
    metadata:
      labels:
        app: backend-fastapi
    spec:
      containers:
        - name: api
          image: webgis-backend:TAG  # [PERLU KONFIRMASI] registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8000"
            - name: REDIS_AUTH_ENABLED
              value: "true"
            - name: REDIS_AUTH_TTL_SECONDS
              value: "0"
            # REDIS_URL (dengan password), SECRET_KEY, CORS_ORIGINS, TRUSTED_PROXY_CIDRS, DB_* → Secret
            # contoh REDIS_URL: redis://:$(password)@redis:6379/0
          envFrom:
            - secretRef:
                name: backend-fastapi-env  # [PERLU KONFIRMASI]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-fastapi
  namespace: webgis
spec:
  selector:
    app: backend-fastapi
  # ClusterIP — sessionAffinity: None (default) → sticky OFF
  sessionAffinity: None
  ports:
    - name: http
      port: 8000
      targetPort: http
