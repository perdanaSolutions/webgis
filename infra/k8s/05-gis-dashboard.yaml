apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-dashboard
  namespace: webgis
spec:
  replicas: 2  # [PERLU KONFIRMASI]
  selector:
    matchLabels:
      app: gis-dashboard
  template:
    metadata:
      labels:
        app: gis-dashboard
    spec:
      # Sebar replica ke node berbeda bila ada (preferred: tetap jalan di cluster 1 node).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gis-dashboard
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: gis-dashboard
      # imagePullSecrets: [{name: regcred}]  # [PERLU KONFIRMASI]
      containers:
        - name: nuxt
          image: webgis-dashboard:TAG  # [PERLU KONFIRMASI]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            # NUXT_API_BASE_URL_PYTHON_SERVER → URL publik /api [PERLU KONFIRMASI]
          envFrom:
            - secretRef:
                name: gis-dashboard-env
                optional: true
          # /favicon.ico = file statis Nitro (public/): tidak SSR & tidak memanggil API,
          # jadi FE tidak ikut "unready" saat backend lambat.
          startupProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gis-dashboard
  namespace: webgis
spec:
  selector:
    app: gis-dashboard
  sessionAffinity: None
  ports:
    - name: http
      port: 3000
      targetPort: http
