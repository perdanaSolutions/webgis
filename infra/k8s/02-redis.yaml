# Redis dipisah dua supaya cache tidak pernah menggusur sesi login:
#
#   redis        (StatefulSet + PVC) : sesi auth gis:auth:* (REDIS_URL). AOF everysec + maxmemory-policy
#                                      noeviction -> kunci sesi tidak dibuang; restart pod TIDAK me-logout user.
#   redis-cache  (Deployment, tanpa PVC): cache JSON peta gis:map:* + ubin Foto Udara (REDIS_CACHE_URL).
#                                      maxmemory + allkeys-lru -> penuh = kunci lama dibuang, bukan error.
#                                      Hilang saat restart = aman (cache dibangun ulang dari DB/GeoServer).
#
# Backend: REDIS_CACHE_URL kosong -> cache ikut REDIS_URL (perilaku lama, satu Redis).
# Password dari Secret `redis-auth` key `password` (dipakai keduanya). Hanya ClusterIP.
#
# HA (opsional, belum diaktifkan — jangan over-engineer di 1 node):
#   - Redis Sentinel (bitnami/redis chart, architecture=replication, sentinel.enabled=true), atau
#   - Redis managed (ElastiCache / Memorystore / Upstash) -> cukup ganti REDIS_URL di Secret.
#   Catatan: auth fail-closed, jadi selama `redis` down login/API ber-auth gagal (by design ADR-001).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: webgis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          args:
            - >-
              exec redis-server
              --requirepass "$REDIS_PASSWORD"
              --appendonly yes --appendfsync everysec
              --save 900 1 --save 300 100
              --maxmemory 400mb --maxmemory-policy noeviction
              --dir /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
            failureThreshold: 60   # AOF besar butuh waktu dimuat ulang
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi   # > maxmemory 400mb + overhead AOF rewrite
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: local-path   # k3s default; sesuaikan cluster [PERLU KONFIRMASI]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: webgis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: webgis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c"]
          # Tanpa persistence: cache murni. maxmemory < limit container agar tidak OOMKilled.
          args:
            - >-
              exec redis-server
              --requirepass "$REDIS_PASSWORD"
              --appendonly no --save ""
              --maxmemory 768mb --maxmemory-policy allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: webgis
spec:
  type: ClusterIP
  selector:
    app: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Izinkan hanya pod API/worker ke kedua Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-api
  namespace: webgis
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [redis, redis-cache]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend-fastapi
        - podSelector:
            matchLabels:
              app: upload-worker
      ports:
        - protocol: TCP
          port: 6379
