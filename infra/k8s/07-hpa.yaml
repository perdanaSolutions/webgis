# Kebijakan: scale out saat CPU atau memory ≥ 70%; scale in saat sepi (HPA default).
# min/max = placeholder [PERLU KONFIRMASI]
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-fastapi
  namespace: webgis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-fastapi
  minReplicas: 2   # [PERLU KONFIRMASI]
  maxReplicas: 10  # [PERLU KONFIRMASI]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gis-dashboard
  namespace: webgis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gis-dashboard
  minReplicas: 2  # [PERLU KONFIRMASI]
  maxReplicas: 6  # [PERLU KONFIRMASI]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
