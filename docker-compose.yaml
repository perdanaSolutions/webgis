services:
  backend_fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: gis-backend-python
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ./backend_fastapi/.env
        required: false
    command: ["python", "-m", "app.serve"]
    environment:
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: "8000"
      MTLS_HOST: 0.0.0.0
      MTLS_PORT: "8443"
    # Hanya berkas server. ca.key dan sertifikat klien tidak ikut ke container.
    volumes:
      - ./backend_fastapi/certs/runtime:/app/certs/runtime:ro

  # Mengerjakan antrian upload GeoJSON (audit.upload_jobs). Tanpa service ini job tetap 'queued'.
  upload_worker:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: gis-upload-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ./backend_fastapi/.env
        required: false
    command: ["python", "-m", "app.workers.upload_jobs"]
    # Saat redeploy, job yang sedang berjalan diberi waktu selesai sebelum container dimatikan.
    stop_grace_period: 10m
    depends_on:
      - backend_fastapi

  gis-dashboard:
    build:
      context: ./gis-dashboard
      dockerfile: Dockerfile
    container_name: gis-dashboard-nuxt
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ./gis-dashboard/.env
        required: false
    environment:
      NUXT_API_BASE_URL_PYTHON_SERVER: http://127.0.0.1:8000/api
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3000
    depends_on:
      - backend_fastapi
