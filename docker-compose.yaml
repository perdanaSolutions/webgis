services:
  backend_pyton:
    build:
      context: ./backend_pyton
      dockerfile: Dockerfile
    container_name: gis-backend-python
    restart: unless-stopped
    env_file:
      - ./backend_pyton/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - gis-network

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: gis-api-node
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./gis-dashboard/datas:/gis-dashboard/datas:ro
    networks:
      - gis-network

  gis-dashboard:
    build:
      context: ./gis-dashboard
      dockerfile: Dockerfile
    container_name: gis-dashboard-nuxt
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
      - backend_pyton
    networks:
      - gis-network

  caddy:
    image: caddy:2-alpine
    container_name: gis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gis-dashboard
      - api
      - backend_pyton
    networks:
      - gis-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  gis-network:
    driver: bridge
